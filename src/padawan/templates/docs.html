{% extends "base.html" %}
{% block title %}Docs - Padawan{% endblock %}
{% block content %}
<h2>Docs</h2>
<section class="course-grid">
  {% for doc in docs %}
  <article class="course-card">
    <h3><a href="/docs/{{ doc.slug }}">{{ doc.title }}</a></h3>
    <p class="muted">{{ doc.slug }}</p>
  </article>
  {% endfor %}
</section>
{% endblock %}
