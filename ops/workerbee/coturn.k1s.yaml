apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: coturn
spec:
  image: docker.io/coturn/coturn:4.12.0
  replicas: 1
  command:
    - turnserver
  args:
    - --fingerprint
    - --lt-cred-mech
    - --user=padawan:padawan-turn-dev
    - --realm=padawan.local
    - --no-cli
    - --no-tls
    - --no-dtls
    - --min-port=49160
    - --max-port=49200
  ports:
    - name: turn
      containerPort: 3478
  service:
    port: 3478
    targetPort: 3478
  health:
    readiness:
      tcpSocket:
        port: 3478
      initialDelaySeconds: 2
      periodSeconds: 5
    liveness:
      tcpSocket:
        port: 3478
      initialDelaySeconds: 10
      periodSeconds: 10
  resources:
    requests:
      cpu: 0.1
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi
  security:
    readOnlyRootFilesystem: false
    seccompProfileType: RuntimeDefault
