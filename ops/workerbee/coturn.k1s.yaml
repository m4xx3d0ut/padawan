apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: coturn
  namespace: padawan
spec:
  image: coturn/coturn:4.12.0
  replicas: 1
  command:
    - turnserver
  args:
    - --fingerprint
    - --lt-cred-mech
    - --user=padawan:padawan-turn-dev
    - --realm=padawan.local
    - --no-cli
    - --no-tls
    - --no-dtls
    - --min-port=49160
    - --max-port=49200
  ports:
    - name: turn
      containerPort: 3478
  service:
    port: 3478
    targetPort: 3478
  resources:
    requests:
      cpu: 0.1
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi
  security:
    readOnlyRootFilesystem: false
    dropCapabilities: ["ALL"]
    seccompProfileType: RuntimeDefault
