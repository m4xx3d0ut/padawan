apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: padawan
spec:
  image: localhost/padawan:dev
  replicas: 1
  serviceAccountName: padawan
  resources:
    requests:
      cpu: 0.1
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  ports:
    - name: http
      containerPort: 8787
  service:
    port: 8787
    targetPort: 8787
  env:
    - name: PADAWAN_HOST
      value: "0.0.0.0"
    - name: PADAWAN_PORT
      value: "8787"
    - name: PADAWAN_STATE_DIR
      value: /data/padawan
    - name: PADAWAN_TURN_HOST
      value: app.padawan.workerbee.localhost
    - name: PADAWAN_TURN_SECRET
      value: padawan-turn-dev
    - name: TMPDIR
      value: /data/padawan/tmp
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
  security:
    readOnlyRootFilesystem: true
    dropCapabilities: ["ALL"]
    seccompProfileType: RuntimeDefault
  storage:
    - name: data
      mountPath: /data/padawan
      retention: Retain
  health:
    readiness:
      httpGet:
        path: /healthz
        port: 8787
      initialDelaySeconds: 2
      periodSeconds: 5
    liveness:
      httpGet:
        path: /healthz
        port: 8787
      initialDelaySeconds: 10
      periodSeconds: 10
  ingress:
    host: app.padawan.workerbee.localhost
    path: /
    tls: true
