[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "padawan"
version = "0.1.0"
description = "Local progressive coding teacher with Codex CLI and WorkerBee validation hooks"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Padawan contributors"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
padawan = "padawan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["padawan"]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
"padawan" = [
    "templates/**/*.html",
    "static/**/*",
    "content/**/*.json",
    "docs/wiki/*.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
